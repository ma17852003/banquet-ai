<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E1B33">
<title>宴會指揮官｜AI 超級團隊</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700;900&family=JetBrains+Mono:wght@500;700;800&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="theme.css?v=6">
<style>
  body { overflow: hidden; }
  #app { position: relative; z-index: 1; height: 100dvh; display: flex; flex-direction: column; max-width: 560px; margin: 0 auto; }

  /* HUD */
  .hud { height: var(--hud-h); flex: none; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
         gap: var(--sp-2); padding: 0 var(--sp-4); background: var(--c-navy-800); box-shadow: 0 1px 0 rgba(255,255,255,.05) inset; }
  .hud .timer { font-family: var(--font-mono); font-weight: 700; font-size: var(--fs-hud); font-variant-numeric: tabular-nums; }
  .hud .timer.warn { color: var(--c-tomato); }
  .hud .timer.pulse { animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.06); } }
  .hud .score { justify-self: end; text-align: right; line-height: 1.1; }
  .hud .score b { font-family: var(--font-mono); font-weight: 700; font-size: var(--fs-hud); color: var(--c-gold); }
  .hud .chip { max-width: 100%; overflow: hidden; }

  main { flex: 1; min-height: 0; overflow-y: auto; padding: var(--sp-5) var(--sp-4) var(--sp-8); }
  main.fixed { overflow: hidden; display: flex; flex-direction: column; padding-bottom: var(--sp-3); }

  .actionbar { flex: none; padding: var(--sp-2) var(--sp-4) calc(var(--sp-2) + env(safe-area-inset-bottom));
               min-height: var(--actionbar-h); display: flex; align-items: center; gap: var(--sp-3);
               background: var(--c-navy-800); box-shadow: 0 -1px 0 rgba(255,255,255,.05) inset; }
  .actionbar .hint { color: var(--c-muted); font-size: var(--fs-sm); text-align: center; width: 100%; }

  h1.title { font-family: var(--font-serif); font-weight: 900; font-size: var(--fs-2xl); line-height: 1.15; }
  h2.title { font-family: var(--font-serif); font-weight: 700; font-size: var(--fs-xl); line-height: 1.2; margin: var(--sp-1) 0 var(--sp-3); }
  p.lead { color: var(--text-dim); margin-top: var(--sp-2); }

  /* 入場：桌卡 2×4 */
  .tables-pick { display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp-3); margin: var(--sp-5) 0; }
  .seat-card { min-height: 64px; border-radius: var(--r-panel); background: var(--panel); border: 1.5px solid var(--line);
               display: flex; align-items: center; gap: var(--sp-3); padding: var(--sp-3); text-align: left;
               transition: border-color var(--t-ui), background-color var(--t-ui); }
  .seat-card .shape { width: 26px; height: 26px; }
  .seat-card small { display: block; font-family: var(--font-mono); font-size: var(--fs-xs); color: var(--c-muted); letter-spacing: .1em; }
  .seat-card[aria-pressed="true"] { border-color: var(--c-ivory); background: var(--c-navy-700); }
  .code-input { width: 100%; height: 56px; border-radius: var(--r-panel); border: 1.5px solid var(--line); background: var(--c-navy-950);
                color: var(--text); font-family: var(--font-mono); font-size: 28px; letter-spacing: .4em; text-align: center; }
  .code-input:focus { outline: none; border-color: var(--c-gold); }
  label.kicker { display: block; margin-bottom: var(--sp-2); }

  /* 菜單卡 */
  .menu { margin-top: var(--sp-4); }
  .menu .head { text-align: center; padding: var(--sp-5) var(--sp-3) var(--sp-3); }
  .menu ol { list-style: none; }
  .course { display: grid; grid-template-columns: 76px 1fr auto; align-items: center; gap: var(--sp-3);
            min-height: 72px; width: 100%; padding: var(--sp-3) var(--sp-2); border-top: 1px dashed var(--c-paper-line);
            text-align: left; position: relative; color: var(--c-ink); }
  .course .num { font-family: var(--font-mono); font-size: var(--fs-xs); letter-spacing: .1em; color: var(--c-ink-muted); line-height: 1.3; }
  .course .name { font-family: var(--font-serif); font-weight: 700; font-size: var(--fs-lg); line-height: 1.25; }
  .course .name small { display: block; font-family: var(--font-sans); font-weight: 400; font-size: var(--fs-sm); color: var(--c-ink-muted); }
  .course .st { font-family: var(--font-mono); font-weight: 700; font-size: var(--fs-lg); color: var(--c-gold-ink); }
  .course .st i { font-size: 22px; color: var(--c-ink-muted); }
  .course.done::before { content: ""; position: absolute; left: 0; top: 18%; bottom: 18%; width: 3px; background: var(--c-gold); border-radius: 2px; }
  .course.soon { opacity: .55; }
  .course .go { display: inline-flex; align-items: center; gap: 4px; font-family: var(--font-sans); font-size: var(--fs-sm); font-weight: 700;
                color: var(--c-ivory); background: var(--c-navy-900); border-radius: var(--r-pill); padding: 6px 14px; }

  /* 員工證 */
  .badge-card { border-radius: var(--r-panel); overflow: hidden; margin: var(--sp-4) 0; box-shadow: var(--sh-rest); }
  .badge-card .top { background: var(--c-navy-950); padding: var(--sp-6); text-align: center; border-bottom: 1px solid var(--line); }
  .badge-card .top i { font-size: 56px; color: var(--c-ivory); }
  .badge-card .bottom { background: var(--c-ivory); color: var(--c-ink); padding: var(--sp-5); }
  .badge-card .role { font-family: var(--font-serif); font-weight: 900; font-size: var(--fs-xl); }
  .rules { margin-top: var(--sp-4); color: var(--text-dim); font-size: var(--fs-sm); display: grid; gap: var(--sp-2); }
  .rules div { display: flex; gap: var(--sp-2); align-items: flex-start; }
  .rules i { color: var(--c-ivory); font-size: 18px; margin-top: 2px; }

  /* ① 提示詞積木 */
  .meter { display: grid; grid-template-columns: repeat(4,1fr); gap: 6px; margin: var(--sp-2) 0 var(--sp-3); }
  .meter span { height: 6px; border-radius: 3px; background: var(--c-navy-700); transition: background-color var(--t-ui); }
  .meter span.on { background: var(--c-ivory-dim); }
  .slots { display: grid; gap: var(--sp-2); flex: none; }
  .slot { display: grid; grid-template-columns: 64px 1fr; gap: var(--sp-2); align-items: center; min-height: 56px; width: 100%;
          padding: var(--sp-2) var(--sp-3); border-radius: var(--r-panel); border: 1.5px dashed var(--c-navy-700); text-align: left; }
  .slot.active { border-style: solid; border-color: var(--c-ivory-dim); background: var(--c-navy-800); }
  .slot .lab { font-family: var(--font-mono); font-size: var(--fs-xs); letter-spacing: .1em; color: var(--c-muted); line-height: 1.3; }
  .slot .lab b { display: block; font-family: var(--font-sans); font-size: var(--fs-sm); color: var(--text); letter-spacing: 0; }
  .slot .val { font-size: var(--fs-sm); line-height: 1.45; }
  .slot .val.empty { color: var(--c-muted); }
  .pool { margin-top: var(--sp-4); flex: 1; min-height: 0; overflow-y: auto; display: grid; align-content: start; gap: var(--sp-2); }
  .pool .kicker { margin-bottom: var(--sp-1); }
  .opt { width: 100%; text-align: left; font-size: var(--fs-md); line-height: 1.5; min-height: 56px;
         transition: transform var(--t-tap) var(--ease-out); }
  .opt:active { transform: scale(.98); }
  .opt.picked { box-shadow: inset 0 0 0 2px var(--c-navy-900); }

  /* ② 找碴 */
  .spotbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: var(--sp-3); flex: none; }
  .dots { display: flex; gap: 6px; }
  .dots span { width: 14px; height: 14px; border-radius: 50%; border: 1.5px solid var(--c-ivory-dim); }
  .dots span.on { background: var(--c-gold); border-color: var(--c-gold); }
  .plan { flex: 1; min-height: 0; overflow-y: auto; padding: var(--sp-4) var(--sp-5); }
  .plan h3 { font-family: var(--font-serif); font-size: var(--fs-lg); margin: 2px 0 var(--sp-2); }
  .line { display: block; width: 100%; text-align: left; min-height: 48px; padding: var(--sp-2) var(--sp-2); border-radius: 4px;
          border-bottom: 1px dashed var(--c-paper-line); font-size: var(--fs-md); line-height: 1.55; color: var(--c-ink); position: relative; }
  .line:disabled { cursor: default; }
  .line .hl { background-image: linear-gradient(transparent 62%, rgba(212,175,55,.55) 62%); background-repeat: no-repeat;
              background-size: 0% 100%; transition: background-size var(--t-reveal) var(--ease-out); }
  .line.hit .hl { background-size: 100% 100%; }
  .line.miss { animation: missflash 600ms; }
  @keyframes missflash { 0%,60% { background: var(--c-tomato-soft); } 100% { background: transparent; } }
  .line .note { display: block; margin-top: 4px; font-size: var(--fs-sm); line-height: 1.5; }
  .line.hit .note { color: var(--c-gold-ink); font-weight: 500; }
  .line.miss .note, .line.cleared .note { color: var(--c-ink-muted); }
  .line .mark { font-family: var(--font-mono); font-size: var(--fs-xs); font-weight: 700; margin-right: 6px; }
  .line.hit .mark { color: var(--c-gold-ink); }
  .line.miss .mark { color: var(--c-tomato-ink); }

  /* ④ 排座 */
  .guests { display: flex; gap: var(--sp-2); overflow-x: auto; padding: 2px 2px var(--sp-3); flex: none; scroll-snap-type: x proximity; }
  .guest { flex: none; width: 168px; min-height: 84px; text-align: left; scroll-snap-align: start;
           transition: transform var(--t-ui) var(--ease-snap); }
  .guest b { display: block; font-size: var(--fs-md); line-height: 1.3; }
  .guest .tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
  .tag { display: inline-flex; align-items: center; gap: 3px; font-size: var(--fs-xs); padding: 2px 6px; border-radius: var(--r-pill);
         background: #E9E1CD; color: var(--c-ink); }
  .guest.armed { transform: translateY(-4px) scale(1.03); box-shadow: inset 0 0 0 2px var(--c-navy-900); }
  .tbls { flex: 1; min-height: 0; overflow-y: auto; display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp-2); align-content: start; }
  .tbl { border-radius: var(--r-panel); border: 1.5px dashed var(--c-navy-700); padding: var(--sp-2) var(--sp-3); text-align: left;
         min-height: 84px; transition: border-color var(--t-ui), background-color var(--t-ui); }
  .tbl.wide { grid-column: 1 / -1; }
  .armed-mode .tbl { border-color: var(--c-navy-600); border-style: solid; }
  .tbl .nm { display: flex; align-items: center; gap: 6px; font-weight: 700; }
  .tbl .nm i { font-size: 18px; }
  .tbl .nt { font-size: var(--fs-xs); color: var(--c-muted); }
  .tbl .seated { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
  .pill { font-size: var(--fs-xs); padding: 4px 8px; border-radius: var(--r-pill); background: var(--c-ivory); color: var(--c-ink); min-height: 28px; }

  /* ③ 隱藏成本 */
  .budget { flex: none; padding: var(--sp-3) var(--sp-5); }
  .brow { display: flex; justify-content: space-between; gap: var(--sp-3); font-size: var(--fs-sm); padding: 2px 0; }
  .brow b { font-weight: 500; white-space: nowrap; }
  .brow.sum { border-top: 1px dashed var(--c-paper-line); margin-top: 4px; padding-top: 6px; font-weight: 700; }
  .brow.sum b { font-weight: 700; }
  .costs { flex: 1; min-height: 0; overflow-y: auto; display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp-2); align-content: start; }
  .cost { min-height: 64px; border-radius: var(--r-ticket); background: var(--c-ivory); color: var(--c-ink); padding: var(--sp-2) var(--sp-3);
          text-align: left; display: flex; flex-direction: column; justify-content: space-between; gap: 4px; font-size: var(--fs-md); line-height: 1.35;
          transition: background-color var(--t-ui), color var(--t-ui), transform var(--t-tap); }
  .cost b { font-family: var(--font-mono); font-size: var(--fs-xs); color: var(--c-ink-muted); }
  .cost[aria-pressed="true"] { background: var(--c-navy-900); color: var(--c-gold); box-shadow: inset 0 0 0 1.5px var(--c-gold); }
  .cost[aria-pressed="true"] b { color: var(--c-gold); }
  .cost:active { transform: scale(.97); }
  .costtotal { flex: none; display: flex; align-items: baseline; flex-wrap: wrap; gap: 0 var(--sp-3); padding-top: var(--sp-3); }
  .costtotal b { font-size: 28px; font-weight: 800; }
  .capnote { width: 100%; font-size: var(--fs-sm); color: var(--text-dim); }

  /* ⑤ 客訴分類 */
  .sorthead { flex: none; display: flex; justify-content: space-between; align-items: center; min-height: 28px; }
  .combo { color: var(--c-gold); font-weight: 800; font-size: var(--fs-lg); }
  .stack { flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: center; padding: var(--sp-3) 0; }
  .qcard { width: 100%; padding: var(--sp-5) var(--sp-6); font-size: var(--fs-lg); line-height: 1.5; font-weight: 500;
           animation: cardin var(--t-ui) var(--ease-out); }
  .qcard p { margin-top: var(--sp-2); }
  @keyframes cardin { from { transform: translateY(10px); opacity: 0; } to { transform: none; opacity: 1; } }
  .qcard.flyok { transition: transform var(--t-ui) var(--ease-out), opacity var(--t-ui); transform: translateY(40px) scale(.9); opacity: 0; }
  .qcard.flyng { animation: shake 360ms; }
  @keyframes shake { 0%,100% { transform: none; } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
  .edge { height: 10px; margin: 0 auto; border-radius: 0 0 6px 6px; background: var(--c-ivory-dim); }
  .edge.e1 { width: 92%; opacity: .6; } .edge.e2 { width: 84%; opacity: .3; }
  .alldone { text-align: center; color: var(--text-dim); }
  .verdict { flex: none; min-height: 28px; display: flex; align-items: center; justify-content: center; gap: 6px; font-weight: 700; margin-bottom: var(--sp-2); }
  .verdict.ok { color: var(--c-gold); }
  .verdict.ng { color: var(--c-tomato); }
  .over { color: var(--c-tomato); font-size: var(--fs-lg); }
  .verdict.prev { color: var(--c-muted); font-weight: 500; }
  .verdict.prev::before { content: "上一則："; }
  .zones { flex: none; display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp-2); }
  .zone { min-height: 76px; border-radius: var(--r-panel); border: 1.5px solid var(--c-navy-600); background: var(--panel);
          padding: var(--sp-2) var(--sp-3); text-align: left; display: flex; flex-direction: column; justify-content: center; gap: 2px;
          transition: background-color var(--t-tap), border-color var(--t-tap), transform var(--t-tap); }
  .zone .zn { display: flex; align-items: center; gap: 6px; font-weight: 700; }
  .zone .zn i { font-size: 18px; }
  .zone .zh { font-size: var(--fs-xs); color: var(--c-muted); line-height: 1.35; }
  .zone:active { transform: scale(.98); }
  .zone.ok { border-color: var(--c-gold); background: var(--c-gold-soft); }
  .zone.ng { border-color: var(--c-tomato); background: var(--c-tomato-soft); }

  /* 結算 */
  .result-head { text-align: center; padding-top: var(--sp-3); }
  .bigscore { font-family: var(--font-mono); font-weight: 800; font-size: 64px; line-height: 1; color: var(--c-gold); margin: var(--sp-3) 0 var(--sp-1); }
  .stats { display: flex; justify-content: center; gap: var(--sp-4); color: var(--text-dim); font-size: var(--fs-sm); flex-wrap: wrap; }
  .sync { margin: var(--sp-3) auto 0; font-size: var(--fs-sm); display: flex; align-items: center; justify-content: center; gap: var(--sp-2); }
  .sync.bad { color: var(--c-tomato); }
  .pin { display: flex; align-items: center; gap: var(--sp-3); margin: var(--sp-4) auto 0; width: fit-content; padding: var(--sp-2) var(--sp-4) var(--sp-2) var(--sp-2);
         border-radius: var(--r-pill); border: 1px solid var(--c-gold); animation: pinpop 600ms var(--ease-snap); }
  .pin i { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: var(--c-navy-950);
           border: 2px solid var(--c-gold); color: var(--c-gold); font-size: 20px; }
  @keyframes pinpop { from { transform: scale(.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .learn { margin-top: var(--sp-5); padding: var(--sp-4); border-radius: var(--r-panel); background: var(--panel); }
  .learn .kicker { margin-bottom: var(--sp-1); }
  .review { margin-top: var(--sp-4); display: grid; gap: var(--sp-2); }
  .review .row { display: grid; grid-template-columns: 22px 1fr; gap: var(--sp-2); font-size: var(--fs-sm); line-height: 1.5; }
  .review .row i { font-size: 18px; margin-top: 1px; }
  .review .ok i { color: var(--c-gold); }
  .review .ng i { color: var(--c-tomato); }
  .review .row small { display: block; color: var(--text-dim); }
  .take { margin-top: var(--sp-5); }
  .take .ticket { margin-top: var(--sp-2); font-size: var(--fs-sm); line-height: 1.6; white-space: pre-wrap; }
  .take .acts { display: flex; gap: var(--sp-2); margin-top: var(--sp-3); flex-wrap: wrap; }
  .take .acts a, .take .acts button { flex: 1; text-decoration: none; min-width: 120px; }

  /* 銀餐蓋 */
  .cloche { position: fixed; inset: 0; z-index: 80; display: grid; place-items: center; background: rgba(10,20,38,.94);
            transition: opacity 400ms; }
  .cloche.out { opacity: 0; pointer-events: none; }
  .cloche svg { width: 220px; overflow: visible; }
  .cloche .dome { transform-origin: 160px 150px; transform-box: view-box; }
  .cloche.lift .dome { animation: lift var(--t-ritual) var(--ease-in-out) forwards; }
  @keyframes lift { to { transform: translateY(-40px) rotate(12deg); opacity: 0; } }
  .cloche .cap { position: absolute; bottom: 22%; left: 0; right: 0; text-align: center; font-family: var(--font-serif); font-size: var(--fs-xl); }
  #confetti { position: fixed; inset: 0; z-index: 81; pointer-events: none; }

  /* 成果卡 */
  .final { aspect-ratio: 9 / 16; max-height: calc(100dvh - var(--hud-h) - 120px); margin: 0 auto; width: auto; max-width: 100%;
           display: flex; flex-direction: column; gap: 10px; padding: var(--sp-5) var(--sp-5) var(--sp-4); overflow: hidden; }
  .final .ftitle { font-family: var(--font-serif); font-weight: 900; font-size: 30px; line-height: 1.15; }
  .final .frow { display: flex; justify-content: space-between; align-items: baseline; font-size: var(--fs-sm); padding: 3px 0; border-bottom: 1px dashed var(--c-paper-line); }
  .final .frow b { font-family: var(--font-mono); }
  .final .ftotal { font-family: var(--font-mono); font-weight: 800; font-size: 40px; line-height: 1; color: var(--c-gold-ink); }
  .final .fprompt { background: #EFE6D2; border-radius: 4px; padding: 8px 10px; font-size: 12px; line-height: 1.5; flex: 1; min-height: 0; overflow: hidden; }
  .final .fpins { display: flex; gap: 6px; flex-wrap: wrap; }
  .final .fpins span { font-size: var(--fs-xs); padding: 3px 8px; border-radius: var(--r-pill); border: 1px solid var(--c-gold-ink); color: var(--c-gold-ink); }

  .toast { position: fixed; left: 50%; bottom: calc(var(--actionbar-h) + 16px); transform: translateX(-50%); z-index: 70;
           background: var(--c-ivory); color: var(--c-ink); padding: 10px 16px; border-radius: var(--r-panel); font-size: var(--fs-sm);
           box-shadow: var(--sh-rest); }

  .rotate { display: none; }
  @media (orientation: landscape) and (max-height: 500px) {
    .rotate { display: grid; place-items: center; position: fixed; inset: 0; z-index: 90; background: var(--c-navy-900); }
  }
</style>
</head>
<body>
<div id="app">
  <header class="hud" id="hud" hidden></header>
  <main id="main" aria-live="off"></main>
  <footer class="actionbar" id="bar"></footer>
</div>
<div class="sr-only" id="live" aria-live="polite"></div>
<div class="rotate"><div class="ticket" style="max-width:280px;text-align:center"><div class="no">NOTICE</div>請把手機轉回直的</div></div>

<script src="game-data.js?v=6"></script>
<script src="common.js?v=6"></script>
<script src="app.js?v=6"></script>
</body>
</html>
