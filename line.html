<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>數位生產線｜投影幕</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700;900&family=JetBrains+Mono:wght@500;700;800&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="theme.css?v=9">
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<style>
  body { overflow: hidden; }
  .top { position: relative; z-index: 1; display: flex; align-items: baseline; gap: 2vw; padding: 1.6vw 3vw .6vw; }
  .top h1 { font-family: var(--font-serif); font-weight: 900; font-size: clamp(28px, 2.8vw, 56px); }
  .k { font-family: var(--font-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--c-muted); font-size: clamp(13px, 1vw, 20px); }
  .top .brand { margin-left: auto; color: var(--c-muted); font-size: clamp(13px, 1vw, 20px); }
  .stage { position: relative; z-index: 1; display: grid; grid-template-columns: 55fr 45fr; gap: 2.4vw; padding: .6vw 3vw 5.5vw; height: calc(100vh - 5.5vw); }
  h2 { font-family: var(--font-serif); font-size: clamp(20px, 1.7vw, 34px); margin-bottom: .8vw; display: flex; align-items: baseline; gap: 1vw; }
  h2 small { font-family: var(--font-mono); font-size: clamp(12px, .85vw, 17px); color: var(--c-muted); letter-spacing: .1em; font-weight: 500; }
  .left, .right { min-height: 0; display: flex; flex-direction: column; }

  /* 前台：備料看板 */
  .board { display: grid; grid-template-columns: repeat(4, 1fr); gap: .8vw; }
  .sup { background: var(--panel); border-radius: var(--r-panel); padding: .9vw 1vw; min-height: 9.5vw; display: flex; flex-direction: column; gap: .3vw;
         border: 2px solid transparent; transition: border-color var(--t-ui), background-color var(--t-ui); }
  .sup .nm { font-weight: 700; font-size: clamp(16px, 1.35vw, 28px); }
  .sup .it { color: var(--c-muted); font-size: clamp(16px, 1.1vw, 22px); }
  .sup .st { margin-top: auto; font-weight: 700; font-size: clamp(15px, 1.2vw, 24px); display: flex; align-items: center; gap: .4vw; color: var(--c-muted); }
  .sup.ok .st { color: var(--c-ivory); }
  .sup.late .st, .sup.out .st { color: var(--c-tomato); }
  .sup.flash { border-color: var(--c-ivory); }
  .sup .gap { font-size: clamp(20px, 1.5vw, 30px); color: var(--c-tomato); font-weight: 700; display: flex; align-items: flex-start; gap: .3vw; line-height: 1.25; }
  .feed { margin-top: 1.2vw; min-height: 0; overflow: hidden; display: flex; flex-direction: column; }
  .notes { display: grid; gap: .5vw; }
  .note { background: var(--c-ivory); color: var(--c-ink); border-radius: var(--r-ticket); padding: .7vw 1vw; font-size: clamp(20px, 1.5vw, 30px); line-height: 1.4;
          display: flex; gap: .7vw; align-items: flex-start; animation: noteIn var(--t-reveal) var(--ease-out); }
  .note i { font-size: 1.4em; flex: none; }
  .note time { margin-left: auto; font-family: var(--font-mono); font-size: .75em; color: var(--c-ink-muted); flex: none; }
  .empty { color: var(--c-muted); font-size: clamp(14px, 1.1vw, 22px); }
  @keyframes noteIn { from { transform: translateY(-10px); opacity: 0; } to { transform: none; opacity: 1; } }

  /* 後台：n8n 流程 */
  .flow { display: grid; gap: .5vw; }
  .node { display: flex; align-items: center; gap: 1vw; padding: .9vw 1.2vw; border-radius: var(--r-panel); background: var(--panel);
          border: 2px solid var(--c-navy-700); font-size: clamp(16px, 1.3vw, 26px); font-weight: 700; color: var(--c-muted);
          transition: border-color var(--t-ui), color var(--t-ui), background-color var(--t-ui); }
  .node i { font-size: 1.5em; }
  .node .no { font-family: var(--font-mono); font-size: .7em; letter-spacing: .1em; }
  .node .role { display: none; }
  .flow.named .node .role { display: inline; }
  .node .det { margin-left: auto; font-weight: 500; font-size: .75em; max-width: 50%; text-align: right; }
  .node.seen { color: var(--c-ivory-dim); }
  .node.lit { border-color: var(--c-ivory); color: var(--c-ivory); background: var(--c-navy-700); }
  .node.unplugged { border-style: dashed; border-color: var(--c-tomato); color: var(--c-tomato); background: var(--c-tomato-soft); }
  .arrow { text-align: center; color: var(--c-navy-600); font-size: clamp(14px, 1.1vw, 22px); line-height: 1; }
  .log { margin-top: 1vw; flex: 1; min-height: 0; overflow: hidden; background: var(--c-navy-950); border-radius: var(--r-panel); padding: .8vw 1vw;
         font-family: var(--font-mono); font-size: clamp(16px, 1.1vw, 22px); line-height: 1.6; color: var(--c-ivory-dim); }
  .log div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .log .bad { color: var(--c-tomato); }

  /* 疊層 */
  .overlay { position: fixed; inset: 0; z-index: 80; background: rgba(10,20,38,.95); display: grid; place-items: center; }
  .overlay[hidden] { display: none; }
  .ovbox { max-width: 72vw; text-align: center; }
  .ovbox .qrbox { width: min(28vw, 56vh); margin: 1.5vw auto; padding: 1.2vw; background: var(--c-ivory); border-radius: var(--r-panel); }
  .ovbox .qrbox svg { width: 100%; height: auto; display: block; }
  .ovbox h3 { font-family: var(--font-serif); font-size: clamp(30px, 3.4vw, 68px); line-height: 1.25; }
  .ovbox p { font-size: clamp(18px, 1.6vw, 32px); color: var(--text-dim); margin-top: 1vw; line-height: 1.5; }
  .gopts { display: grid; gap: 1vw; margin-top: 2vw; text-align: left; }
  .gopt { padding: 1.1vw 1.6vw; border-radius: var(--r-panel); border: 2px solid var(--c-navy-600); font-size: clamp(20px, 1.9vw, 38px); font-weight: 700; background: var(--panel); }
  .gopt.right { border-color: var(--c-gold); background: var(--c-gold-soft); }
  .gopt.right::after { content: "　✓ 正解"; color: var(--c-gold); }
  .banner { position: fixed; left: 50%; top: 1.4vw; transform: translateX(-50%); z-index: 70; background: var(--c-ivory); color: var(--c-ink);
            border-radius: var(--r-panel); padding: 1vw 1.8vw; font-size: clamp(16px, 1.4vw, 28px); max-width: 70vw; box-shadow: var(--sh-rest);
            animation: noteIn var(--t-reveal) var(--ease-out); }
  .banner b { font-family: var(--font-serif); }
  .banner[hidden] { display: none; }
  .offline { color: var(--c-tomato); font-weight: 700; font-size: clamp(13px, 1vw, 20px); }
  .offline[hidden] { display: none; }

  .ctrl { position: fixed; left: 3vw; right: 3vw; bottom: 1vw; z-index: 60; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; opacity: .55; transition: opacity var(--t-ui); }
  .ctrl:hover, .ctrl:focus-within { opacity: 1; }
  .ctrl button, .ctrl a { min-height: 40px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel);
                          font-size: 14px; display: inline-flex; align-items: center; gap: 6px; color: var(--text); text-decoration: none; }
  .ctrl .sep { flex: 1; }
  .ctrl.hidden { display: none; }
  .conn { font-size: 13px; color: var(--c-muted); }
</style>
</head>
<body>
<header class="top"><h1>數位生產線</h1><span class="k" id="meta"></span><span class="offline" id="offline" hidden>離線示範中（連不到 n8n，畫面照常運作）</span><span class="brand">James Wu｜AI 造王者</span></header>
<div class="stage">
  <section class="left">
    <h2>備料看板 <small>FRONT · 大家看得到的</small></h2>
    <div class="board" id="board"></div>
    <div class="feed"><h2 style="margin-top:1.2vw">外場收到的通知 <small>FRONT OF HOUSE</small></h2><div class="notes" id="notes"><p class="empty">還沒有通知</p></div></div>
  </section>
  <section class="right">
    <h2>n8n 流程 <small>BACK · 幕後在發生什麼</small></h2>
    <div class="flow" id="flow"></div>
    <div class="log" id="log" aria-live="polite"></div>
  </section>
</div>

<div class="overlay" id="qrOv" hidden><div class="ovbox"><div class="k">供應商請掃碼回覆</div><div class="qrbox" id="qr"></div><p>每桌是一家供應商：準時、延遲，還是缺貨？</p></div></div>
<div class="overlay" id="guessOv" hidden><div class="ovbox">
  <div class="k">先猜猜看</div><h3>拔掉「通知」這個員工之後，外場什麼時候才會知道生蠔延遲？</h3>
  <div class="gopts"><div class="gopt">A．馬上就知道</div><div class="gopt">B．等有人想到要打電話問</div><div class="gopt" data-right>C．等到客人開始抱怨</div></div>
  <p id="guessExp" hidden>通常是 C：沒人通知，外場就照原本的計畫走，直到客人抱怨才發現。這就是「資訊落差」。按 P 拔掉節點，親眼看看。</p>
</div></div>
<div class="banner" id="banner" hidden></div>

<div class="ctrl" id="ctrl">
  <button id="bQR"><i class="ph ph-qr-code"></i>供應商 QR（Q）</button>
  <button id="bGuess"><i class="ph ph-question"></i>先猜（G）</button>
  <button id="bPlug"><i class="ph ph-plug"></i>拔掉通知節點（P）</button>
  <button id="bReset"><i class="ph ph-arrow-counter-clockwise"></i>重新示範（R）</button>
  <button id="bOff"><i class="ph ph-wifi-slash"></i>離線示範（O）</button>
  <a id="bBack" href="#"><i class="ph ph-trophy"></i>回排行榜</a>
  <span class="sep"></span><span class="conn" id="conn">連線中</span>
  <button id="bHide">隱藏（H）</button>
</div>

<script src="game-data.js?v=9"></script>
<script src="common.js?v=9"></script>
<script>
(function () {
  const $ = s => document.querySelector(s), esc = BQ.esc;
  const RM = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const SUP = GAME.supply.suppliers, supOf = t => SUP.find(x => x.team === Number(t));
  const qs = new URLSearchParams(location.search);
  let session = (qs.get("s") || "").replace(/\D/g, "").slice(0, 4);
  if (session.length !== 4) { session = String(Math.floor(1000 + Math.random() * 9000)); qs.set("s", session); history.replaceState(null, "", "?" + qs.toString()); }
  $("#meta").textContent = "場次 " + session;
  $("#bBack").href = "screen.html?s=" + session;
  const studentURL = new URL("supply.html?s=" + session, location.href).href;

  // ── 畫面骨架 ──
  const NODES = [
    { icon: "flow-arrow", name: "接收回覆", hint: "觸發" },
    { icon: "database", name: "寫進備料表", hint: "抓資料" },
    { icon: "warning-circle", name: "判斷有沒有問題", hint: "判斷" },
    { icon: "bell-simple-ringing", name: "通知外場／廚房", hint: "送出" }
  ];
  $("#flow").innerHTML = NODES.map((n, i) => (i ? '<div class="arrow" aria-hidden="true">▼</div>' : "") +
    `<div class="node" id="n${i}"><i class="ph ph-${n.icon}" aria-hidden="true"></i><span><span class="no">0${i + 1}<span class="role"> · ${n.hint}</span></span><br>${n.name}</span><span class="det" id="d${i}"></span></div>`).join("");
  $("#board").innerHTML = SUP.map(s => `<div class="sup" id="s${s.team}"><span class="nm">${esc(s.name)}</span><span class="it">第 ${s.team} 桌 · ${esc(s.item)}</span>
    <span class="st"><i class="ph ph-hourglass-medium" aria-hidden="true"></i>等待回覆</span><span class="gap" hidden></span></div>`).join("");

  const qr = qrcode(0, "M"); qr.addData(studentURL); qr.make();
  $("#qr").innerHTML = qr.createSvgTag(6, 0).replace(/ width="\d+px"/, "").replace(/ height="\d+px"/, "");

  // ── 狀態 ──
  // epoch＝世代號：每次重置就 +1。重置前還在跑的動畫、晚回來的讀取結果，世代不符一律丟掉
  let notifyOn = true, offline = false, fails = 0, lastId = 0, busy = false, revealed = false, everLit = new Set();
  let epoch = 0, polling = false, plugBusy = false, plugSeq = 0, resetId = null, first = true;
  const applied = [], queue = [];
  const hhmmss = d => new Date(d || Date.now()).toLocaleTimeString("zh-TW", { hour12: false });
  const stLabel = (st, d) => st === "ok" ? "準時送到" : st === "late" ? `延遲 ${d} 分鐘` : st === "out" ? "缺貨" : "等待回覆";
  const stIcon = st => ({ ok: "check-circle", late: "hourglass-medium", out: "x-circle" })[st] || "hourglass-medium";

  function log(text, bad, at) {
    const el = $("#log"), div = document.createElement("div");
    if (bad) div.className = "bad";
    div.textContent = `[${hhmmss(at)}] ${text}`; el.prepend(div);
    while (el.children.length > 12) el.lastChild.remove();
  }
  function plugUI() {
    $("#n3").classList.toggle("unplugged", !notifyOn);
    $("#d3").textContent = notifyOn ? "" : "已拔掉";
    $("#bPlug").innerHTML = notifyOn ? '<i class="ph ph-plug"></i>拔掉通知節點（P）' : '<i class="ph ph-plugs-connected"></i>接回通知節點（P）';
  }
  // 前台：每家供應商的實際狀況，以及外場以為的狀況（落差用紅字標出來）
  function renderBoard() {
    const view = BQ.fohView(applied);
    SUP.forEach(s => {
      const v = view[s.team], card = $("#s" + s.team);
      const st = v ? v.truth.status : null;
      card.className = "sup" + (st ? " " + st : "");
      card.querySelector(".st").innerHTML = `<i class="ph ph-${stIcon(st)}" aria-hidden="true"></i>${stLabel(st, v && v.truth.delay)}`;
      const gap = card.querySelector(".gap");
      if (v && v.gap) { gap.hidden = false; gap.innerHTML = `<i class="ph ph-warning" aria-hidden="true"></i>外場以為：${stLabel(v.foh.status, v.foh.delay)}`; }
      else gap.hidden = true;
    });
  }
  function addNote(text, at) {
    const box = $("#notes"); const e = box.querySelector(".empty"); if (e) e.remove();
    const div = document.createElement("div"); div.className = "note";
    div.innerHTML = `<i class="ph ph-bell-simple-ringing" aria-hidden="true"></i><span>${esc(text)}</span><time>${hhmmss(at)}</time>`;
    box.prepend(div); while (box.children.length > 4) box.lastChild.remove();
  }
  const wait = ms => new Promise(r => setTimeout(r, RM ? 0 : ms));
  async function lightNode(i, det, ms) {
    for (let k = 0; k < 4; k++) $("#n" + k).classList.remove("lit");
    $("#n" + i).classList.add("lit", "seen"); everLit.add(i);
    if (!revealed && everLit.size === NODES.length) reveal();
    if (i !== 3 || notifyOn) $("#d" + i).textContent = det || "";
    await wait(ms);
  }

  // 一筆回覆＝四個員工接力：接收 → 寫入 → 判斷 → 通知。每次等待後確認世代沒變才繼續
  async function play(r, ep) {
    const alive = () => ep === epoch;
    const ms = queue.length >= 3 ? 200 : 650;   // 一次進來很多筆就加速，排在後面的人不用等太久
    const s = supOf(r.Team), label = stLabel(r.Status, r.DelayMin), problem = r.Status !== "ok";
    await lightNode(0, `第 ${r.Team} 桌 ${s.name}`, ms); if (!alive()) return;
    log(`收到 第 ${r.Team} 桌 ${s.name}：${label}${r.Note ? "（" + r.Note + "）" : ""}`, false, r.CreatedAt);
    applied.push(r); renderBoard();
    const card = $("#s" + r.Team); card.classList.add("flash"); setTimeout(() => card.classList.remove("flash"), 900);
    await lightNode(1, `第 ${applied.length} 筆`, ms); if (!alive()) return;
    log(`寫進備料表 #${r.Id}`);
    await lightNode(2, problem ? "有問題" : "沒問題", ms); if (!alive()) return;
    log(problem ? `判斷：${label} → 有問題，要通知` : `判斷：${label} → 沒問題`);
    if (!problem) { await lightNode(3, "不用通知", ms); if (!alive()) return; log("不用通知"); }
    else if (BQ.isNotified(r.Notified)) { await lightNode(3, "已通知", ms); if (!alive()) return; log(`通知外場／廚房：${r.Notice}`); addNote(r.Notice, r.CreatedAt); }
    else { await lightNode(3, "", ms); if (!alive()) return; log("通知節點被拔掉了，外場沒收到消息", true); }
    for (let k = 0; k < 4; k++) $("#n" + k).classList.remove("lit");
  }
  // 先體驗、後命名：四個節點都亮過一次，才揭曉它們的名字
  function reveal() {
    revealed = true; $("#flow").classList.add("named");
    banner("<b>這就是自動化：觸發 → 抓資料 → 判斷 → 送出。</b><br>像籃球傳球，一棒接一棒，沒有人盯著也會自己跑完。", 9000);
  }
  async function pump() {
    if (busy) return; busy = true;
    const ep = epoch;
    try { while (queue.length && ep === epoch) await play(queue.shift(), ep); }
    finally { busy = false; if (queue.length) pump(); }   // 重置後新世代的回覆，接著播
  }
  let bannerT;
  function banner(html, ms) { const b = $("#banner"); b.innerHTML = html; b.hidden = false; clearTimeout(bannerT); bannerT = setTimeout(() => { b.hidden = true; }, ms); }

  // ── 連線：每 1.5 秒讀一次看板；上一次還沒回來就不發新的；只處理新的回覆 ──
  async function poll() {
    if (offline || polling) return;
    polling = true;
    const ep = epoch, ps = plugSeq, t0 = Date.now(); let retry = false;
    try {
      const ctrl = new AbortController(); const tid = setTimeout(() => ctrl.abort(), 2500);
      const res = await fetch(`${GAME.api}/banquet-supply-board?session=${session}`, { cache: "no-store", signal: ctrl.signal });
      clearTimeout(tid);
      const j = await res.json(); if (!Array.isArray(j.rows)) throw new Error("bad");
      if (offline || ep !== epoch) return;                  // 讀取期間被重置或切離線：這份資料作廢
      fails = 0; $("#conn").textContent = "連線中（真的 n8n）";
      // 拔節點切換中，或讀取發出後才切換過：伺服器回的開關狀態可能是舊的，不採用
      if (!plugBusy && ps === plugSeq && j.notifyOn !== notifyOn) { notifyOn = j.notifyOn; plugUI(); }
      if (resetId !== null && j.resetId !== resetId) resetLocal();   // 有人（這台或別台）按了重置
      resetId = j.resetId;
      const fresh = j.rows.filter(r => r.Id > lastId);
      if (first) { fresh.forEach(r => applied.push(r)); renderBoard(); first = false; }   // 重新整理頁面時，舊資料直接擺上，不重播
      else fresh.forEach(r => queue.push(r));
      if (fresh.length) lastId = Math.max(lastId, ...fresh.map(r => r.Id));
      pump();
    } catch (e) {
      if (offline || ep !== epoch) return;
      fails++; $("#conn").textContent = `連不到 n8n（第 ${fails} 次）`;
      // 等很久才失敗（卡住、逾時）才 0.2 秒後重讀，最壞約 9.5 秒切離線；馬上回錯（tunnel 偶發 502）照 1.5 秒節奏，小抖動不會誤切
      if (fails >= 3) goOffline(); else retry = Date.now() - t0 > 2000;
    } finally { polling = false; if (retry) setTimeout(poll, 200); }
  }
  function resetLocal() {
    epoch++;
    applied.length = 0; queue.length = 0; lastId = 0; everLit.clear();
    $("#notes").innerHTML = '<p class="empty">還沒有通知</p>'; $("#log").innerHTML = "";
    for (let k = 0; k < 4; k++) { $("#n" + k).classList.remove("lit", "seen"); $("#d" + k).textContent = ""; }
    revealed = false; $("#flow").classList.remove("named");
    plugUI(); renderBoard();
  }
  async function ctl(action) {
    if (offline) return true;
    try {
      const ctrl = new AbortController(); const tid = setTimeout(() => ctrl.abort(), 5000);
      const r = await fetch(`${GAME.api}/banquet-supply-ctl`, { method: "POST", body: new URLSearchParams({ session, action }), signal: ctrl.signal });
      clearTimeout(tid);
      const j = await r.json().catch(() => null); return !!(j && j.ok);
    } catch (e) { return false; }
  }

  // ── 離線示範：連不到 n8n 時，用預錄的 8 筆回覆在網頁裡跑同一套畫面 ──
  const SCRIPT = [ [1, "late", 30], [3, "ok", 0], [2, "out", 0], [4, "ok", 0], [5, "late", 15], [6, "ok", 0], [7, "ok", 0], [8, "late", 60] ];
  let offT = null, offK = 0, offId = 100000;
  function goOffline() {
    if (offline) return;
    offline = true; $("#offline").hidden = false; $("#conn").textContent = "離線示範";
    resetLocal(); offK = 0; clearInterval(offT);
    offT = setInterval(() => {
      if (offK >= SCRIPT.length) { clearInterval(offT); return; }
      const [t, st, d] = SCRIPT[offK++], s = supOf(t);
      queue.push({ Id: ++offId, Team: t, Status: st, DelayMin: d, Note: "", Notified: notifyOn, Notice: notifyOn ? BQ.supplyNotice(s, st, d) : "", CreatedAt: new Date().toISOString() });
      pump();
    }, RM ? 1500 : 3500);
  }

  // ── 老師控制 ──
  const qrT = () => { $("#qrOv").hidden = !$("#qrOv").hidden; };
  const guessT = () => {
    const ov = $("#guessOv");
    if (ov.hidden) { ov.hidden = false; $("#guessExp").hidden = true; ov.querySelectorAll(".gopt").forEach(x => x.classList.remove("right")); }
    else if ($("#guessExp").hidden) { $("#guessExp").hidden = false; ov.querySelector("[data-right]").classList.add("right"); }
    else ov.hidden = true;
  };
  // 按下立刻切換畫面（經 tunnel 確認要 1～2 秒，課堂上不能讓老師乾等）；伺服器沒確認就退回
  const plugT = async () => {
    if (plugBusy) return; plugBusy = true; plugSeq++;
    const next = !notifyOn;
    notifyOn = next; plugUI();
    log(next ? "通知節點接回去了" : "通知節點被拔掉了", !next);
    banner(next ? "<b>接回去了。</b>之後的回覆會照常通知外場。" : "<b>通知節點拔掉了。</b>現在請供應商再回覆一次，看看外場會怎樣。", 5000);
    if (!(await ctl(next ? "notify_on" : "notify_off"))) {
      notifyOn = !next; plugUI(); log("切換沒有成功，已經退回原狀", true); banner("沒有切換成功，請再按一次", 3000);
    }
    plugSeq++; plugBusy = false;
  };
  const resetT = async () => {
    if (!(await ctl("reset"))) { banner("重置失敗，請再按一次", 3000); return; }
    notifyOn = true; resetLocal();
    if (offline) { offline = false; goOffline(); }
  };
  const offT2 = () => { offline ? location.reload() : goOffline(); };
  const hideT = () => $("#ctrl").classList.toggle("hidden");
  const KEYS = { q: qrT, g: guessT, p: plugT, r: resetT, o: offT2, h: hideT };
  $("#bQR").onclick = qrT; $("#bGuess").onclick = guessT; $("#bPlug").onclick = plugT; $("#bReset").onclick = resetT; $("#bOff").onclick = offT2; $("#bHide").onclick = hideT;
  document.addEventListener("keydown", e => {
    const k = e.key.toLowerCase();
    if (KEYS[k]) KEYS[k]();
    if (k === "escape") { $("#qrOv").hidden = true; $("#guessOv").hidden = true; }
  });

  plugUI(); renderBoard(); poll(); setInterval(poll, 1500);
  $("#qrOv").hidden = false;   // 一進來先秀 QR
})();
</script>
</body>
</html>
