<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E1B33">
<title>數位生產線｜供應商回覆</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700;900&family=JetBrains+Mono:wght@500;700;800&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="theme.css?v=9">
<style>
  body { overflow: hidden; }
  #app { position: relative; z-index: 1; height: 100dvh; display: flex; flex-direction: column; max-width: 560px; margin: 0 auto; }
  main { flex: 1; min-height: 0; overflow-y: auto; padding: var(--sp-5) var(--sp-4) var(--sp-8); }
  .actionbar { flex: none; padding: var(--sp-2) var(--sp-4) calc(var(--sp-2) + env(safe-area-inset-bottom)); min-height: var(--actionbar-h);
               display: flex; align-items: center; gap: var(--sp-3); background: var(--c-navy-800); }
  h1 { font-family: var(--font-serif); font-weight: 900; font-size: var(--fs-2xl); line-height: 1.2; margin-top: 6px; }
  .sub { color: var(--text-dim); margin-top: 4px; }
  .analogy { margin-top: var(--sp-4); display: flex; gap: var(--sp-3); align-items: flex-start; }
  .analogy i { font-size: 28px; flex: none; }
  .opts { display: grid; gap: var(--sp-2); margin-top: var(--sp-5); }
  .opt { min-height: 64px; border-radius: var(--r-panel); border: 1.5px solid var(--c-navy-600); background: var(--panel);
         display: flex; align-items: center; gap: var(--sp-3); padding: 0 var(--sp-4); font-size: var(--fs-lg); font-weight: 700; text-align: left; }
  .opt i { font-size: 26px; }
  .opt[aria-pressed="true"] { border-color: var(--c-ivory); background: var(--c-ivory); color: var(--c-ink); }
  .delays { display: flex; gap: var(--sp-2); margin-top: var(--sp-2); }
  .delays button { flex: 1; min-height: 48px; border-radius: var(--r-pill); border: 1.5px solid var(--c-navy-600); background: var(--panel); font-weight: 700; }
  .delays button[aria-pressed="true"] { border-color: var(--c-ivory); background: var(--c-ivory); color: var(--c-ink); }
  label.kicker { display: block; margin: var(--sp-4) 0 var(--sp-2); font-family: var(--font-sans); font-size: var(--fs-md); letter-spacing: 0; text-transform: none; color: var(--text); font-weight: 700; }
  .note { width: 100%; height: 48px; border-radius: var(--r-panel); border: 1.5px solid var(--line); background: var(--c-navy-950);
          color: var(--text); padding: 0 var(--sp-3); font-size: var(--fs-md); }
  .note:focus { outline: none; border-color: var(--c-ivory-dim); }
  .sent { margin-top: var(--sp-5); }
  .sent .ticket { margin-top: var(--sp-2); font-size: var(--fs-md); }
  .err { color: var(--c-tomato); margin-top: var(--sp-3); }
  .tables-pick { display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp-3); margin: var(--sp-4) 0; }
  .seat-card { min-height: 60px; border-radius: var(--r-panel); background: var(--panel); border: 1.5px solid var(--line);
               display: flex; align-items: center; gap: var(--sp-3); padding: var(--sp-3); text-align: left; }
  .seat-card .shape { width: 24px; height: 24px; }
  .seat-card[aria-pressed="true"] { border-color: var(--c-ivory); background: var(--c-navy-700); }
  .brand { margin-top: var(--sp-6); text-align: center; font-size: var(--fs-sm); color: var(--c-muted); }
</style>
</head>
<body>
<div id="app"><main id="main"></main><footer class="actionbar" id="bar"></footer></div>
<script src="game-data.js?v=9"></script>
<script src="common.js?v=9"></script>
<script>
(function () {
  const $ = s => document.querySelector(s), esc = BQ.esc, main = $("#main"), bar = $("#bar");
  // 自己的存檔 bq-supply，不覆寫遊戲用的 bq-who；場次碼一定要剛好 4 位數，不然請重新掃碼
  const who = BQ.store.get("bq-who", {}), mine = BQ.store.get("bq-supply", {});
  const raw = new URLSearchParams(location.search).get("s");
  const session = raw == null ? (mine.session || who.session || "") : (/^\d{4}$/.test(raw) ? raw : "");
  let team = mine.session === session ? mine.team : (who.session === session ? who.team : null);
  const sent = [];

  function pickTeam() {
    let pick = null;
    main.innerHTML = `<div class="kicker">數位生產線 · 現場示範</div><h1>你們是第幾桌？</h1>
      <div class="tables-pick">${GAME.teams.map(t => `<button class="seat-card" data-t="${t.no}" aria-pressed="false">${BQ.shapeSVG(t, 24)}<b>第 ${t.no} 桌 · ${t.name}</b></button>`).join("")}</div>`;
    bar.innerHTML = `<button class="btn-serve" id="go" disabled>先選一張桌</button>`;
    main.querySelectorAll(".seat-card").forEach(b => b.onclick = () => {
      pick = Number(b.dataset.t);
      main.querySelectorAll(".seat-card").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
      $("#go").disabled = false; $("#go").textContent = "確定";
    });
    $("#go").onclick = () => { team = pick; BQ.store.set("bq-supply", { session, team }); form(); };
  }

  async function post(data) {
    try {
      const ctrl = new AbortController(); const tid = setTimeout(() => ctrl.abort(), 8000);
      const r = await fetch(GAME.api + "/banquet-supply", { method: "POST", body: new URLSearchParams(data), signal: ctrl.signal });
      clearTimeout(tid);
      const j = await r.json().catch(() => null);
      return !!(j && j.ok === true);
    } catch (e) { return false; }
  }

  function form() {
    const sup = GAME.supply.suppliers.find(x => x.team === Number(team)), t = BQ.team(team);
    let status = null, delay = null;
    const ST = [
      { id: "ok", icon: "check-circle", label: "準時送到" },
      { id: "late", icon: "hourglass-medium", label: "會延遲" },
      { id: "out", icon: "x-circle", label: "缺貨，送不出來" }
    ];
    main.innerHTML = `
      <div class="kicker">數位生產線 · 第 ${t.no} 桌 · ${t.name}</div>
      <h1>你們是：${esc(sup.name)}</h1>
      <p class="sub">負責今晚的「${esc(sup.item)}」</p>
      <div class="ticket analogy"><i class="ph ph-basketball" aria-hidden="true"></i>
        <span>就像籃球傳球：你們是<b>第一棒</b>，把消息傳出去。後面的 AI 員工會一棒接一棒，把消息送到外場和廚房。抬頭看投影幕，看球怎麼傳。</span></div>
      <div class="opts">${ST.map(s => `<button class="opt" data-s="${s.id}" aria-pressed="false"><i class="ph ph-${s.icon}" aria-hidden="true"></i>${s.label}</button>`).join("")}</div>
      <div id="delayBox" hidden><label class="kicker">延遲多久？</label>
        <div class="delays">${[15, 30, 60].map(d => `<button data-d="${d}" aria-pressed="false">${d} 分鐘</button>`).join("")}</div></div>
      <label class="kicker" for="note">補一句話（可以不寫）</label>
      <input id="note" class="note" maxlength="40" placeholder="例如：塞車中，司機說 18:40 到" autocomplete="off">
      <div class="sent" id="sent"></div><p class="err" id="err" aria-live="polite"></p>
      <p class="brand">James Wu｜AI 造王者</p>`;
    bar.innerHTML = `<button class="btn-serve" id="send" disabled>先選一個狀況</button>`;
    const btn = $("#send");
    const check = () => {
      const ok = status && (status !== "late" || delay);
      btn.disabled = !ok; btn.innerHTML = ok ? '<i class="ph ph-paper-plane-tilt"></i>送出回覆' : (status === "late" ? "選延遲多久" : "先選一個狀況");
    };
    main.querySelectorAll(".opt").forEach(b => b.onclick = () => {
      status = b.dataset.s; main.querySelectorAll(".opt").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
      $("#delayBox").hidden = status !== "late"; if (status !== "late") delay = null; check();
    });
    main.querySelectorAll(".delays button").forEach(b => b.onclick = () => {
      delay = Number(b.dataset.d); main.querySelectorAll(".delays button").forEach(x => x.setAttribute("aria-pressed", String(x === b))); check();
    });
    btn.onclick = async () => {
      btn.disabled = true; btn.textContent = "送出中…"; $("#err").textContent = "";
      const note = $("#note").value.trim().slice(0, 40);
      const ok = await post({ session, team: String(team), status, delay: String(delay || 0), note });
      if (!ok) { $("#err").textContent = "沒送出去，請再按一次（網路或老師的伺服器可能忙線）"; check(); return; }
      const label = status === "late" ? `會延遲 ${delay} 分鐘` : ST.find(s => s.id === status).label;
      sent.unshift(label + (note ? `（${note}）` : ""));
      $("#sent").innerHTML = `<div class="kicker">已送出，抬頭看投影幕</div>${sent.map(x => `<div class="ticket">${esc(x)}</div>`).join("")}`;
      let left = 5;
      const tick = () => {
        if (left > 0) { btn.disabled = true; btn.textContent = `已送出（${left} 秒後可以再送）`; left--; setTimeout(tick, 1000); }
        else { check(); btn.innerHTML = '<i class="ph ph-arrow-counter-clockwise"></i>狀況變了，再送一次'; }
      };
      tick();
    };
  }

  if (!/^\d{4}$/.test(session)) {
    main.innerHTML = `<div class="kicker">數位生產線</div><h1>請掃投影幕上的 QR 碼進來</h1><p class="sub">網址需要帶場次碼。</p>`;
  } else if (!team) pickTeam(); else form();
})();
</script>
</body>
</html>
