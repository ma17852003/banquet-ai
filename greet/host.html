<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>迎賓台｜主持人</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700;900&family=JetBrains+Mono:wght@500;700;800&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="../theme.css?v=21">
<style>
  /* 主持人頁：台上平板最小 24px、投影（1920 寬）最小 32px；金色只代表 VIP */
  :focus-visible { outline-color: var(--text); }   /* 這個 app 的金色只代表 VIP，鍵盤聚焦框不用金色 */
  body { overflow: hidden; background: var(--bg); display: flex; flex-direction: column; height: 100vh; }
  :root { --min: clamp(24px, 1.67vw, 40px); }
  .top { flex: none; height: 4.4vw; min-height: 56px; display: flex; align-items: center; gap: 1.6vw; padding: 0 2vw; border-bottom: 1px solid var(--line);
         font-family: var(--font-mono); font-size: var(--min); color: var(--text-dim); font-variant-numeric: tabular-nums; }
  .top b { color: var(--text); font-weight: 700; }
  .top .brand { font-family: var(--font-serif); font-weight: 900; color: var(--text); margin-right: auto; }
  .conn { font-family: var(--font-sans); font-size: var(--min); display: inline-flex; align-items: center; gap: .4vw; }
  .conn.bad { color: var(--wrong); }
  .stage { flex: 1; min-height: 0; display: grid; grid-template-columns: 64fr 36fr; gap: 2vw; padding: 1.6vw 2vw 2vw; }

  /* 左：現在請唸（提詞機：一句照念，名字最大）*/
  .next { --pad: 2.4vw; display: flex; flex-direction: column; padding: 1.4vw var(--pad) var(--pad); border-radius: var(--r-panel);
          background: var(--panel); border: 2px solid transparent; min-width: 0; overflow: hidden; }
  .next > * { flex-shrink: 0; }
  .next.vip { border-color: var(--c-gold); }
  [data-theme="light"] .next.vip { border-color: var(--c-gold-ink); }
  .next .head { display: flex; align-items: center; justify-content: space-between; font-size: var(--min); color: var(--text-dim); font-weight: 700; letter-spacing: .12em; }
  .next .vtag { font-family: var(--font-mono); font-weight: 800; color: var(--gold-text); display: inline-flex; gap: .4vw; align-items: center; letter-spacing: 0; }
  .next .body { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; justify-content: safe center; }   /* 放不下時靠上排，不往上蓋到標題列 */
  .next .body > * { flex-shrink: 0; }   /* 空間緊時不准把介紹那行壓成 0 高 */
  .next .lead { font-size: clamp(28px, 2.3vw, 56px); font-weight: 500; color: var(--text-dim); }
  .next .who { font-size: clamp(32px, 2.9vw, 68px); font-weight: 700; line-height: 1.25; margin-top: .4vw; }
  .next .nm { font-family: var(--font-serif); font-weight: 900; font-size: clamp(64px, min(6.6vw, 11vh), 156px); line-height: 1.06; margin-top: .3vw; overflow-wrap: anywhere; }
  .next .en { font-size: clamp(28px, 2.3vw, 56px); font-weight: 500; color: var(--text-dim); }
  .next .intro { font-size: clamp(26px, 2vw, 48px); font-weight: 500; margin-top: 1.6vh; padding-top: 1.4vh; border-top: 1px solid var(--line);   /* 虛線只留給「唸法未確認」；間距跟著螢幕高度：矮的投影（1280×720）也放得下 */
                 display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .next .pron { display: flex; flex-wrap: wrap; align-items: center; gap: .6vw 1.2vw; margin-top: 1.2vh; font-size: clamp(26px, 2vw, 48px); }
  .next .pron b { font-family: var(--font-mono); font-weight: 700; }
  .next .pron b.unsure { text-decoration: underline dashed var(--text-dim); text-underline-offset: .3em; }   /* 唸法未確認＝虛線 */
  .unsure-tag { display: inline-flex; align-items: center; gap: .4vw; font-size: var(--min); color: var(--text-dim); border: 1px solid var(--text-dim); border-radius: var(--r-pill); padding: .2vw .9vw; }
  .acts { display: flex; gap: 1.2vw; padding-top: 1.2vw; }
  .acts button { min-height: max(64px, 4.6vw); padding: 0 2vw; border-radius: 12px; font-size: var(--min); font-weight: 700; display: inline-flex; align-items: center; gap: .6vw;
                 border: 2px solid var(--line); background: transparent; color: var(--text); }
  .acts .done { background: var(--text); color: var(--bg); border-color: var(--text); flex: 1; justify-content: center; }
  .empty { margin: auto 0; text-align: center; }
  .empty b { display: block; font-size: clamp(40px, 3.4vw, 80px); font-weight: 700; color: var(--text-dim); }
  .empty span { font-size: var(--min); color: var(--text-dim); }
  .preempt { margin-top: 1.4vh; padding: .7vw 1.2vw; border-radius: 12px; border: 2px solid var(--text); font-size: var(--min); display: flex; gap: 1vw; align-items: center; flex-wrap: wrap; }
  .preempt button { min-height: 48px; padding: 0 1.4vw; border-radius: 10px; border: 2px solid var(--text); background: var(--text); color: var(--bg); font-size: var(--min); font-weight: 700; }

  /* 右：接下來（最重要，放最上）→ 主賓還沒到 → 已唸 */
  .side { display: flex; flex-direction: column; gap: 2vh; min-width: 0; overflow: hidden; }
  .sec h3 { font-size: var(--min); letter-spacing: .1em; color: var(--text-dim); font-weight: 700; margin-bottom: .6vw; display: flex; justify-content: space-between; }
  .sec h3 small { font-size: inherit; font-weight: 500; letter-spacing: 0; }
  .upnext { flex: none; }   /* 「接下來」最重要，永遠整張顯示；空間不夠時讓已唸那區縮 */
  .pendsec { flex: none; }
  .donesec { flex: 1 1 0; min-height: calc(var(--min) * 4.8); display: flex; flex-direction: column; }   /* 保底：標題＋一整列「放回去」 */
  .donesec h3 { flex: none; }
  .queue { list-style: none; display: grid; gap: .6vw; overflow: hidden; counter-reset: q; }
  .qcard { counter-increment: q; display: grid; grid-template-columns: auto 1fr; column-gap: 1vw; align-items: center; padding: .7vw 1vw; border-radius: 10px; background: var(--panel); border: 2px solid transparent; will-change: transform; }
  .qcard::before { content: counter(q); grid-row: span 2; width: max(40px, 2.4vw); height: max(40px, 2.4vw); border-radius: 50%; border: 2px solid var(--text-dim);
                   display: grid; place-items: center; font-family: var(--font-mono); font-weight: 800; font-size: var(--min); color: var(--text); }
  .qcard.vip { border-color: var(--c-gold); }
  [data-theme="light"] .qcard.vip { border-color: var(--c-gold-ink); }
  .qcard > * { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }   /* 卡片固定兩行，高度不會因為頭銜長而變 */
  .qcard .n { font-family: var(--font-serif); font-weight: 700; font-size: clamp(28px, 2vw, 48px); line-height: 1.2; }
  .qcard .m { font-size: var(--min); color: var(--text-dim); }
  .qcard .m span + span { margin-left: .8vw; }
  .qcard .vt { color: var(--gold-text); font-family: var(--font-mono); font-weight: 800; }
  .qcard.enter { animation: slidein var(--t-reveal) var(--ease-out); }
  @keyframes slidein { from { opacity: 0; transform: translateX(-12px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .qcard.enter { animation: none; } }
  .pend li.names { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }   /* 主賓固定一行，放不下用「…」，總數在標題 */
  .pend li, .donelist li { list-style: none; font-size: var(--min); display: flex; gap: .6vw; align-items: baseline; padding: .15vw 0; }
  .pend .t, .donelist .t { color: var(--text-dim); }
  .donelist { overflow-y: auto; min-height: 0; }   /* 全部已唸都列出來，放不下就在這一區捲（整頁不捲）*/
  .donelist li { align-items: center; color: var(--text-dim); }
  .donelist .nm { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .donelist button { margin-left: auto; border: 1px solid var(--line); background: transparent; color: var(--text-dim); border-radius: 8px; font-size: var(--min); padding: 4px 12px; white-space: nowrap; }
  .more { font-size: var(--min); color: var(--text-dim); margin-top: .4vw; }
  /* 矮的投影（1280×720）：介紹只留一行、卡片內距縮小，左卡放得下「先唸他」提示 */
  @media (max-height: 760px) {
    .next .intro { -webkit-line-clamp: 1; }
    .qcard { padding-top: .45vw; padding-bottom: .45vw; }
  }
</style>
</head>
<body>
<div class="top">
  <span class="brand">迎賓台</span>
  <span>已到 <b id="cA">0</b>／<span id="cT">0</span></span><span>已唸 <b id="cR">0</b></span><span>待唸 <b id="cW">0</b></span>
  <span class="conn" id="conn"><i class="ph ph-check"></i>連線中</span>
</div>
<div class="stage">
  <section class="next" id="next" aria-live="polite"></section>
  <aside class="side">
    <div class="sec upnext"><h3>接下來</h3><ol class="queue" id="queue"></ol><p class="more" id="more"></p></div>
    <div class="sec pendsec"><h3>主賓還沒到 <small id="pendSum"></small></h3><ul class="pend" id="pend"></ul></div>
    <div class="sec donesec"><h3>已唸 <small id="doneSum">0 位</small></h3><ul class="donelist" id="doneList"></ul></div>
  </aside>
</div>
<script src="greet-core.js?v=3"></script>
<script>
(function () {
  const $ = s => document.querySelector(s), esc = GR.esc;
  const qs = new URLSearchParams(location.search);
  const event = GR.normEvent(qs.get("e")) || "demo";
  const pinKey = "gr-pin-" + event, store = { get: k => { try { return localStorage.getItem(k); } catch (e) { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) { /* 無痕模式 */ } } };
  let state = null, pinned = store.get(pinKey) || "", lastKey = "", doneKey = "", doneTop = "", seen = new Set(), firstPaint = true, hiddenRead = new Set();

  function speak(g) {
    if (!("speechSynthesis" in window)) return;
    const u = new SpeechSynthesisUtterance(g.en || g.zh);
    u.lang = g.en ? "en-US" : "zh-TW"; u.rate = .85;
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  }

  // 剛按「已唸」、伺服器還沒確認的人，畫面上先當作唸過（畫面和鍵盤共用這一份）
  const viewNow = () => GR.hostView({ guests: state.guests, st: Object.fromEntries(Object.entries(state.st).map(([k, v]) => [k, hiddenRead.has(k) ? Object.assign({}, v, { state: "read" }) : v])) }, pinned);
  function render() {
    if (!state) return;
    const view = viewNow();
    const show = g => g && [g.gid, g.zh, g.en, g.say, g.ok, g.title, g.org, g.intro, g.vip, g.at];   // 臨開場改唸法、頭銜後重存名單，畫面要跟著變
    const key = JSON.stringify([show(view.next), show(view.preempt), view.queue.map(show), view.pendingVip.map(show), view.done.map(show), !!state.truncated]);
    $("#cA").textContent = view.counts.arrived; $("#cR").textContent = view.counts.read; $("#cW").textContent = view.counts.waiting; $("#cT").textContent = state.guests.length;
    if (key === lastKey) return;   // 畫面要顯示的東西沒變：不動 DOM（不閃爍、不跳頂）
    lastKey = key;
    if (view.next && view.next.gid !== pinned) { pinned = view.next.gid; store.set(pinKey, pinned); }

    // 左：現在請唸（一句照念：讓我們歡迎 頭銜・單位 名字）
    const g = view.next, nx = $("#next"), sc = g && GR.hostScript(g);
    nx.classList.toggle("vip", !!(g && g.vip));
    nx.innerHTML = !g ? `<div class="head">現在請唸</div><p class="empty"><b>等來賓到場…</b><span>櫃台按「到了」，這裡就會跳出來</span></p>` : `
      <div class="head"><span>現在請唸</span>${g.vip ? `<span class="vtag"><i class="ph ph-star"></i>VIP</span>` : ""}</div>
      <div class="body">
        <div class="lead">讓我們歡迎</div>
        ${sc.who ? `<div class="who">${esc(sc.who)}</div>` : ""}
        <div class="nm">${esc(sc.name)}</div>${g.zh && g.en ? `<div class="en">${esc(g.en)}</div>` : ""}
        ${g.intro ? `<div class="intro">${esc(g.intro)}</div>` : ""}
        ${g.say || !g.ok ? `<div class="pron">${g.say ? `<span>唸法 <b class="${g.ok ? "" : "unsure"}">${esc(g.say)}</b></span>` : ""}${g.ok ? "" : `<span class="unsure-tag"><i class="ph ph-question"></i>唸法未確認：先唸頭銜＋姓</span>`}</div>` : ""}
        ${view.preempt ? `<div class="preempt"><span>順序在前的 <b>${esc(view.preempt.zh || view.preempt.en)}</b> 到了</span><button id="swap">先唸他</button></div>` : ""}
      </div>
      <div class="acts"><button id="say"><i class="ph ph-speaker-high"></i>發音（S）</button><button class="done" id="readBtn"><i class="ph ph-check"></i>唸完了，下一位（空白鍵）</button></div>`;
    if (g) {
      $("#say").onclick = () => speak(g);
      $("#readBtn").onclick = () => markRead(g);
      if (view.preempt) $("#swap").onclick = () => { pinned = view.preempt.gid; store.set(pinKey, pinned); lastKey = ""; render(); };
    }

    // 右：接下來（只動有變的卡，FLIP 讓位；編號用 CSS counter）、主賓還沒到、已唸
    $("#pendSum").textContent = view.pendingVip.length ? `${view.pendingVip.length} 位` : "";
    $("#pend").innerHTML = !view.pendingVip.length ? `<li class="t">主賓都到了</li>`
      : `<li class="names">${view.pendingVip.map(p => esc(p.zh || p.en)).join("・")}</li>`;
    const ol = $("#queue"), shown = view.queue.slice(0, 3), before = new Map();
    ol.querySelectorAll(".qcard").forEach(el => before.set(el.dataset.g, el.getBoundingClientRect().top));
    const els = shown.map(q => {
      let el = [...ol.querySelectorAll(".qcard")].find(x => x.dataset.g === q.gid);
      const html = `<div class="n">${esc(q.zh || q.en)}</div><div class="m">${q.vip ? `<span class="vt">★ VIP</span>` : ""}<span>到 ${esc(GR.hhmm(q.at))}</span><span>${esc(q.title)}</span></div>`;
      if (!el) { el = document.createElement("li"); el.className = "qcard"; el.dataset.g = q.gid; if (!firstPaint && !seen.has(q.gid)) el.classList.add("enter"); }
      if (el.innerHTML !== html) el.innerHTML = html;
      el.classList.toggle("vip", !!q.vip);
      seen.add(q.gid); return el;
    });
    ol.querySelectorAll(".qcard").forEach(el => { if (!els.includes(el)) el.remove(); });
    els.forEach(el => ol.appendChild(el));
    if (!matchMedia("(prefers-reduced-motion: reduce)").matches) els.forEach(el => {
      const old = before.get(el.dataset.g); if (old == null) return;
      const dy = old - el.getBoundingClientRect().top;
      if (dy) el.animate([{ transform: `translateY(${dy}px)` }, { transform: "none" }], { duration: 600, easing: "cubic-bezier(0.16,1,0.3,1)" });
    });
    $("#more").textContent = view.queue.length > 3 ? `還有 ${view.queue.length - 3} 位` : (view.queue.length ? "" : "目前沒有其他人");
    $("#doneSum").textContent = `${view.done.length} 位`;
    const dk = JSON.stringify(view.done.map(d => [d.gid, d.zh, d.en]));
    if (dk !== doneKey) {   // 已唸清單沒變就不重建：別人到場重畫時，主持人正要按的「放回去」不會被換掉
      doneKey = dk;
      const top = view.done.length ? view.done[0].gid : "";
      if (top !== doneTop) { doneTop = top; $("#doneList").scrollTop = 0; }   // 剛唸的人排第一：捲回最上面，念錯馬上按得到
      $("#doneList").innerHTML = !view.done.length ? `<li class="t">還沒唸任何人</li>`   // 最近唸的在最上面，每一位都能放回去
        : view.done.map(d => `<li><i class="ph ph-check"></i><span class="nm">${esc(d.zh || d.en)}</span><button data-un="${esc(d.gid)}" aria-label="念錯了，把 ${esc(d.zh || d.en)} 放回去">放回去</button></li>`).join("");
      $("#doneList").querySelectorAll("button").forEach(b => b.onclick = () => markUnread(b.dataset.un));
    }
    firstPaint = false;
  }

  const offline = () => conn(false, `網路斷了：${GR.queued()} 個動作恢復後自動補送`);
  async function act(kind, gid) {
    if (!(await GR.actOrQueue(event, kind, gid))) { offline(); return; }   // 已唸的人照樣收起來，等補送
    poll(true);
  }
  function markRead(g) { hiddenRead.add(g.gid); pinned = ""; lastKey = ""; render(); act("read", g.gid); }   // 先在畫面上收起來，不等伺服器
  // 已唸還沒確認就放回去：畫面先放回來（不然補送完伺服器是「已到」，這位會一直藏到重新整理）；放回去排在已唸後面送
  function markUnread(gid) { if (hiddenRead.delete(gid)) { lastKey = ""; render(); } act("unread", gid); }

  function conn(okk, msg) {
    const c = $("#conn"); c.className = "conn" + (okk ? "" : " bad");
    c.innerHTML = okk ? `<i class="ph ph-check"></i>連線中` : `<i class="ph ph-x"></i>${esc(msg || "連不到伺服器")}`;
  }
  let polling = false;
  async function poll(force) {
    if (polling) return; polling = true;
    try {
      if (GR.queued() && !(await GR.flush())) { offline(); return; }   // 先補送斷線時沒送出去的動作
      const r = await GR.fetchState(event, force || !state ? 0 : state.version);
      if (!r) { conn(false); return; }
      if (r.truncated) conn(false, "動作超過 1000 筆，最早到場的紀錄可能不準，請找技術人員"); else conn(true);   // same 回應也帶 truncated，警告不會被蓋掉
      if (r.same) return;
      state = r;
      hiddenRead.forEach(gid => { const s = r.st[gid]; if (!s || s.state !== "arrived") hiddenRead.delete(gid); });   // 伺服器已確認唸過
      render();
    } finally { polling = false; }
  }
  poll(); setInterval(poll, 2000);

  let lastRead = 0;
  document.addEventListener("keydown", e => {
    const k = e.key.toLowerCase(), g = state && viewNow().next;
    if ([" ", "pagedown", "arrowright"].includes(k)) {
      e.preventDefault();
      if (e.repeat || Date.now() - lastRead < 700 || !g) return;   // 長按或簡報筆連發只算一下，不會一次跳過好幾位
      lastRead = Date.now(); markRead(g);
    }   // 簡報筆的「下一頁」＝已唸
    else if (k === "s" && g) speak(g);
    else if (k === "l") { const light = document.documentElement.dataset.theme !== "light"; document.documentElement.dataset.theme = light ? "light" : "dark"; store.set("gr-theme", light ? "light" : "dark"); }
  });
  if (store.get("gr-theme") === "light") document.documentElement.dataset.theme = "light";
})();
</script>
</body>
</html>
