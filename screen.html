<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>宴會指揮官｜投影幕</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700;900&family=JetBrains+Mono:wght@500;700;800&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="theme.css?v=20">
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<style>
  body { overflow: hidden; }
  /* 一個畫面三欄同時看：分組對抗｜個人排行｜掃碼入座（不用切換）*/
  .stage { position: relative; z-index: 1; height: 100vh; display: grid; grid-template-columns: 28fr 47fr 25fr; gap: 2.2vw; padding: 2.4vw 2.4vw 5.4vw; }
  .col { display: flex; flex-direction: column; min-width: 0; }
  .col-h { display: flex; flex-wrap: wrap; align-items: baseline; column-gap: .8vw; margin-bottom: 1vw; }
  .col-h h2 { font-family: var(--font-serif); font-size: clamp(28px, 2.3vw, 46px); }
  .col-h .sub { font-size: clamp(28px, 1.5vw, 30px); font-weight: 500; color: var(--text-dim); }

  /* 右欄：QR 一直在 */
  .qrcol { align-items: center; text-align: center; }
  .qrcol .col-h { align-self: stretch; justify-content: center; }
  .qrbox { width: min(100%, 44vh); padding: 1vw; background: var(--c-ivory); border-radius: var(--r-panel); }
  .qrbox svg { display: block; width: 100%; height: auto; }
  .code { font-family: var(--font-mono); font-weight: 800; font-size: clamp(56px, 5.6vw, 110px); letter-spacing: .15em; line-height: 1; margin-top: 1.2vw; color: var(--text); }
  .code small { display: block; font-family: var(--font-sans); font-size: clamp(28px, 1.5vw, 30px); font-weight: 500; letter-spacing: 0; color: var(--text-dim); margin-bottom: .4vw; }
  .steps span, .meta span { display: inline-block; }   /* 窄螢幕只在箭頭、分隔號斷行 */
  .steps { margin-top: 1vw; font-size: clamp(28px, 1.5vw, 30px); line-height: 1.4; color: var(--text-dim); }
  .meta { margin-top: auto; font-size: clamp(28px, 1.5vw, 30px); color: var(--c-muted); }

  /* 個人排行 */
  .lb { list-style: none; display: grid; gap: .45vw; }
  .row { display: grid; grid-template-columns: auto 1fr auto auto; align-items: center; gap: 1vw;
         padding: .3vw 1vw; border-radius: var(--r-panel); background: var(--panel); position: relative; will-change: transform; line-height: 1.1; }
  .row .rk { font-family: var(--font-mono); font-weight: 800; font-size: clamp(28px, 2vw, 40px); color: var(--c-muted); min-width: 2ch; }   /* 第 10 名的兩位數不擠到號碼 */
  .row .nm { display: flex; align-items: center; gap: .8vw; min-width: 0; }
  .row .nm .shape { width: clamp(22px, 1.4vw, 28px); height: clamp(22px, 1.4vw, 28px); }
  .row .pno { font-family: var(--font-mono); font-weight: 800; font-size: clamp(30px, 2.4vw, 48px); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .row .tm { font-size: clamp(28px, 1.5vw, 30px); font-weight: 500; color: var(--text-dim); display: inline-flex; align-items: center; gap: .4vw; white-space: nowrap; }
  .row .cells { display: flex; gap: .3vw; }
  .row .cells span { width: clamp(14px, 1vw, 20px); height: clamp(14px, 1vw, 20px); border-radius: 4px; border: 2px solid var(--line); }
  .row .cells span.on { background: var(--c-ivory-dim); border-color: var(--c-ivory-dim); }
  .row .cells span.soon { border-style: dashed; opacity: .5; }
  .row .tot { font-family: var(--font-mono); font-weight: 800; font-size: clamp(32px, 2.6vw, 52px); color: var(--gold-text); min-width: 3ch; text-align: right; font-variant-numeric: tabular-nums; }
  .row .stripe { position: absolute; left: 0; top: 14%; bottom: 14%; width: 6px; border-radius: 3px; }
  .row .up { position: absolute; left: 1vw; top: -.6vw; font-family: var(--font-mono); font-size: clamp(12px, .9vw, 18px); font-weight: 700;
             color: var(--bg); background: var(--text);   /* 跟著燈亮模式反色 */ border-radius: var(--r-pill); padding: 2px 10px; animation: upfade 2.6s forwards; }
  @keyframes upfade { 0%,75% { opacity: 1; } 100% { opacity: 0; } }
  .empty { color: var(--c-muted); font-size: clamp(28px, 1.6vw, 32px); padding: 2vw 0; }

  /* 分組對抗（組員平均分）*/
  .teams { list-style: none; display: grid; gap: .45vw; }
  .trow { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: .9vw; padding: .5vw 1vw;
          border-radius: var(--r-panel); background: var(--panel); position: relative; line-height: 1.1; }
  .trow .rk { font-family: var(--font-mono); font-weight: 800; font-size: clamp(28px, 2vw, 40px); color: var(--c-muted); min-width: 1ch; }
  .trow .nm { display: flex; align-items: center; gap: .6vw; font-size: clamp(28px, 2vw, 40px); font-weight: 700; min-width: 0; white-space: nowrap; }
  .trow .nm .shape { width: clamp(22px, 1.8vw, 36px); height: clamp(22px, 1.8vw, 36px); }
  .trow .nm small { font-size: clamp(28px, 1.5vw, 30px); font-weight: 500; color: var(--text-dim); }
  .trow .avg { font-family: var(--font-mono); font-weight: 800; font-size: clamp(30px, 2.6vw, 52px); color: var(--gold-text); font-variant-numeric: tabular-nums; }
  .trow .stripe { position: absolute; left: 0; top: 14%; bottom: 14%; width: 6px; border-radius: 3px; }

  .ctrl .danger { border-color: var(--wrong); color: var(--wrong); margin-left: auto; }   /* 換行時也固定在最右邊 */
  .confirm { position: fixed; inset: 0; z-index: 90; display: grid; place-items: center; background: rgba(10,20,38,.88); }
  .confirm .box { background: var(--panel); border: 2px solid var(--wrong); border-radius: var(--r-panel); padding: 2.4vw; max-width: 46vw; }
  .confirm h3 { font-size: clamp(24px, 2vw, 40px); margin-bottom: 1vw; }
  .confirm p { font-size: clamp(16px, 1.3vw, 26px); color: var(--text-dim); }
  .confirm .acts { display: flex; gap: 1vw; margin-top: 2vw; justify-content: flex-end; }
  .confirm button { min-height: 52px; padding: 0 24px; border-radius: 10px; font-size: 18px; border: 1px solid var(--line); background: var(--panel); color: var(--text); }
  .confirm button.go { background: var(--wrong); border-color: var(--wrong); color: #fff; font-weight: 700; }

  /* 頒獎畫面：獎名＋提示 → 揭曉得主（不顯示得獎條件）*/
  .awards { position: fixed; inset: 0; z-index: 85; display: grid; place-items: center; background: var(--bg); color: var(--text); }   /* 跟著燈亮模式換色 */
  .awards .box { text-align: center; padding: 3vw; max-width: 80vw; }
  .awards .step { font-family: var(--font-mono); letter-spacing: .12em; color: var(--c-muted); font-size: clamp(28px, 1.6vw, 32px); }
  .awards .ic { font-size: clamp(64px, 6vw, 120px); color: var(--text-dim); margin-top: 1.5vw; }   /* 金色只給分數和答對 */
  .awards .aname { font-family: var(--font-serif); font-weight: 900; font-size: clamp(56px, 5.6vw, 110px); line-height: 1.15; margin-top: .6vw; }
  .awards .hint { font-size: clamp(28px, 2vw, 40px); color: var(--text-dim); margin-top: 1vw; }
  .awards .who { margin-top: 2.4vw; min-height: clamp(90px, 8vw, 160px); display: flex; align-items: center; justify-content: center; gap: 1.2vw;
                 font-size: clamp(64px, 6.4vw, 128px); font-weight: 800; font-family: var(--font-mono); }
  .awards .who small { font-family: var(--font-sans); font-size: clamp(30px, 2.6vw, 52px); font-weight: 700; color: var(--text-dim); display: inline-flex; align-items: center; gap: .6vw; }
  .awards .who .shape { width: clamp(36px, 3vw, 60px); height: clamp(36px, 3vw, 60px); }
  .awards .who.none { font-family: var(--font-sans); font-size: clamp(40px, 3.6vw, 72px); color: var(--c-muted); }
  .awards .tap { margin-top: 2vw; font-size: clamp(16px, 1.1vw, 22px); color: var(--c-muted); }

  /* 老師控制列（投影時可按 H 隱藏）*/
  .ctrl { position: fixed; left: 2.4vw; right: 2.4vw; bottom: 1.2vw; z-index: 60; display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
          opacity: .55; transition: opacity var(--t-ui); }
  .ctrl:hover, .ctrl:focus-within { opacity: 1; }
  .ctrl button { min-height: 40px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel);
                 font-size: 14px; display: inline-flex; align-items: center; gap: 6px; }
  .ctrl button[aria-pressed="true"] { border-color: var(--c-ivory-dim); }
  .ctrl.hidden { display: none; }
  .conn { font-size: 13px; color: var(--c-muted); display: inline-flex; align-items: center; gap: 6px; }
  .conn.bad { color: var(--wrong); }
</style>
</head>
<body>
<div class="stage">
  <section class="col">
    <div class="col-h"><h2>分組對抗</h2><span class="sub">組員平均分</span></div>
    <ol class="teams" id="teams" aria-label="分組排名"></ol>
  </section>
  <section class="col">
    <div class="col-h"><h2>個人排行</h2><span class="sub" id="cnt"></span></div>
    <ol class="lb" id="lb" aria-label="個人即時排行榜"></ol>
  </section>
  <section class="col qrcol">
    <div class="col-h"><h2>掃碼入座</h2></div>
    <div class="qrbox" id="qr"></div>
    <div class="code" id="code"></div>
    <div class="steps"><span>掃 QR</span> <span>→ 選你們的桌</span> <span>→ 記住你的號碼</span></div>
    <div class="meta"><span>James Wu</span>｜<span>AI 造王者</span></div>
  </section>
</div>

<div class="ctrl" id="ctrl">
  <span class="conn" id="conn"><i class="ph ph-check"></i>連線中</span>
  <button id="bAward"><i class="ph ph-trophy"></i>頒獎（A）</button>
  <button id="bTheme" aria-pressed="false"><i class="ph ph-sun"></i>燈亮模式（L）</button>
  <button id="bSound" aria-pressed="false"><i class="ph ph-speaker-slash"></i>音效（M）</button>
  <button id="bHide">隱藏控制列（H）</button>
  <button id="bReset" class="danger"><i class="ph ph-arrow-counter-clockwise"></i>新的一堂課</button>
</div>
<div class="awards" id="awards" hidden role="dialog" aria-modal="true" aria-label="頒獎"><div class="box" id="awBox"></div></div>
<div class="confirm" id="confirm" hidden role="dialog" aria-modal="true" aria-labelledby="cfTitle"><div class="box">
  <h3 id="cfTitle"></h3>
  <p>學生的成績和編號都會清掉（下一位入座重新從 1 號開始），清掉就救不回來。</p>
  <p id="cfMsg" style="margin-top:.8vw"></p>
  <div class="acts"><button id="cfNo">取消</button><button class="go" id="cfYes">確定清掉</button></div>
</div></div>

<script src="game-data.js?v=20"></script>
<script src="common.js?v=20"></script>
<script>
(function () {
  const $ = s => document.querySelector(s);
  const RM = matchMedia("(prefers-reduced-motion: reduce)").matches;

  // 場次碼：1、2、3…；網址沒帶（或帶錯）就是場次 1，寫回網址讓重新整理也一樣
  const qs = new URLSearchParams(location.search);
  const session = BQ.normSession(qs.get("s")) || "1";
  if (qs.get("s") !== session) { qs.set("s", session); history.replaceState(null, "", "?" + qs.toString()); }
  const studentURL = BQ.studentURL(session);   // QR 一律連正式網址，從本機檔案打開投影幕也一樣

  // ── 右欄：QR＋場次碼，整堂課一直在 ──
  // 低容錯：網址多了 LINE 參數，場次碼 1～3 位數時維持 33 格，後排比較好掃（投影畫面不會有污損）
  const qr = qrcode(0, "L"); qr.addData(studentURL); qr.make();
  $("#qr").innerHTML = qr.createSvgTag(6, 0).replace(/ width="\d+px"/, "").replace(/ height="\d+px"/, "");
  $("#code").innerHTML = `<small>場次碼</small>${session}`;
  $("#code").setAttribute("aria-label", "場次碼 " + session.split("").join(" "));

  // ── 左欄：分組對抗，同桌組員平均分（common.js 的 BQ.rankTeams，有測試）──
  let lastData = null, lastTeamsJSON = "";
  function renderTeams() {
    const list = lastData ? BQ.rankTeams(lastData.board) : [];
    const json = JSON.stringify(list);
    if (json === lastTeamsJSON) return;   // 沒變就不動畫面
    lastTeamsJSON = json;
    $("#teams").innerHTML = list.length ? list.map(x => {
      const t = BQ.team(x.team); if (!t) return "";
      return `<li class="trow" aria-label="第 ${x.rank} 名，${BQ.teamLabel(x.team)}，${x.members} 人，平均 ${x.avg} 分">
        <span class="stripe" style="background:${t.color}"></span><span class="rk">${x.rank}</span>
        <span class="nm">${BQ.shapeSVG(t)}<span>${t.name}</span><small>${x.members} 人</small></span><span class="avg">${x.avg}</span></li>`;
    }).join("") : `<li class="empty">等大家入座…</li>`;
  }

  // ── 中欄：個人排行前 10 名（資料沒變就不動畫面；有變才用 FLIP 換位置）──
  const rows = new Map(); let lastJSON = "", lastRank = {}, lastTotal = {};
  function cellsHTML(levels) {
    return GAME.courses.map(c => c.kind === "soon" ? `<span class="soon"></span>` : `<span class="${levels[c.no] != null ? "on" : ""}"></span>`).join("");
  }
  function render(data) {
    lastData = data; renderTeams();
    const board = data.board.filter(b => b.total > 0).slice(0, 10);
    const cnt = `共 ${data.players} 人`; if ($("#cnt").textContent !== cnt) $("#cnt").textContent = cnt;
    const json = JSON.stringify(board) + (board.length ? "" : "|" + (data.players > 0));   // 還沒人得分時，「入座／出菜」提示要跟著人數換
    if (json === lastJSON) return;
    lastJSON = json;
    const lb = $("#lb");
    rows.forEach((el, k) => { if (!board.some(b => String(b.player) === k)) { el.remove(); rows.delete(k); } });   // 掉出前 10 名的拿掉
    if (!board.length) { lb.innerHTML = `<li class="empty">${data.players > 0 ? "等大家出第一道菜…" : "等大家入座…"}</li>`; rows.clear(); lastRank = {}; lastTotal = {}; return; }
    const empty = lb.querySelector(".empty"); if (empty) empty.remove();
    const before = new Map(); rows.forEach((el, k) => before.set(k, el.getBoundingClientRect().top));
    let gained = false, overtook = false;
    board.forEach((b, i) => {
      const key = String(b.player), t = BQ.team(b.team);
      if (!t) return;
      let el = rows.get(key);
      if (!el) { el = document.createElement("li"); el.className = "row"; rows.set(key, el); }
      el.setAttribute("aria-label", `第 ${b.rank} 名，${b.player} 號，${BQ.teamLabel(b.team)}，${b.total} 分`);
      el.innerHTML = `<span class="stripe" style="background:${t.color}"></span><span class="rk">${b.rank}</span>
        <span class="nm"><span class="pno">${b.player} 號</span><span class="tm">${BQ.shapeSVG(t)}${t.name}</span></span>
        <span class="cells" aria-hidden="true">${cellsHTML(b.levels)}</span><span class="tot">${b.total}</span>`;
      if (lastRank[key] != null && i < lastRank[key]) {
        overtook = true;
        const up = document.createElement("span"); up.className = "up"; up.textContent = "↑ 反超"; el.appendChild(up);
      }
      if (lastTotal[key] != null && b.total > lastTotal[key]) gained = true;
      if (lastTotal[key] == null && b.total > 0) gained = true;
      lastRank[key] = i; lastTotal[key] = b.total;
      lb.appendChild(el);
    });
    if (!RM) rows.forEach((el, k) => {
      const old = before.get(k); if (old == null) return;
      const dy = old - el.getBoundingClientRect().top;
      if (dy) el.animate([{ transform: `translateY(${dy}px)` }, { transform: "translateY(0)" }],
                         { duration: 1200, easing: "cubic-bezier(0.16,1,0.3,1)", delay: 60 * lastRank[k] });
    });
    if (overtook) { tone(1320, .35); setTimeout(() => tone(1320, .35), 180); } else if (gained) tone(1320, .5);
  }
  let polling = false;   // 上一次還沒回來就不發新的，免得舊資料晚到把排行榜蓋回去
  async function poll() {
    if (polling) return;
    polling = true;
    const data = await BQ.fetchBoard(session).finally(() => { polling = false; });
    const conn = $("#conn");
    if (data) { conn.className = "conn"; conn.innerHTML = `<i class="ph ph-check"></i>連線中`; render(data); }
    else { conn.className = "conn bad"; conn.innerHTML = `<i class="ph ph-x"></i>連不到計分伺服器（檢查 n8n 與 tunnel）`; }
  }

  // ── 音效：服務鈴，用 Web Audio 即時合成（要先按一次「音效」才會響，瀏覽器規定）──
  let ac = null, soundOn = false;
  function tone(freq, dur, type) {
    if (!soundOn || !ac) return;
    const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime;
    o.type = type || "sine"; o.frequency.value = freq; o.connect(g); g.connect(ac.destination);
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.25, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.start(t); o.stop(t + dur + .05);
  }

  // ── 新的一堂課：要按兩次才清（先跳確認框），沒有鍵盤快捷鍵，避免誤觸 ──
  const cf = $("#confirm");
  const closeCf = () => { cf.hidden = true; $("#bReset").focus(); };
  $("#bReset").onclick = () => {
    $("#cfTitle").textContent = `確定清掉場次 ${session} 的全部成績和編號？`;
    $("#cfMsg").textContent = ""; $("#cfYes").disabled = false; cf.hidden = false; $("#cfNo").focus();
  };
  $("#cfNo").onclick = closeCf;
  $("#cfYes").onclick = async () => {
    $("#cfYes").disabled = true; $("#cfMsg").textContent = "清除中…";
    const r = await BQ.resetSession(session);
    if (!r) { $("#cfMsg").textContent = "不確定有沒有清掉（連不到計分伺服器）。檢查 n8n 和 tunnel 後再按一次，重按沒關係。"; $("#cfYes").disabled = false; return; }
    cf.hidden = true; lastJSON = ""; awList = [];   // 頒獎名單也清掉，免得新班按 A 秀出上一班的得主
    render({ board: [], players: 0 }); poll();   // 先清空畫面，不等下一次輪詢
  };

  // ── 頒獎：打開那一刻把名單算定（common.js 的 BQ.pickAwards，有測試）；每個獎按兩下：先猜、再揭曉 ──
  const aw = $("#awards"); let awList = [], awIdx = 0, awShown = false;
  function drawAward() {
    const a = awList[awIdx], w = a.winner;
    let who = "";
    if (awShown) {
      if (!w) who = `<div class="who none">從缺</div>`;
      else if (a.kind === "team") { const t = BQ.team(w.team); who = `<div class="who">${t ? BQ.shapeSVG(t) : ""}<span>${BQ.esc(BQ.teamLabel(w.team))}</span></div>`; }
      else { const t = BQ.team(w.team); who = `<div class="who">${w.player} 號<small>${t ? BQ.shapeSVG(t) : ""}${BQ.esc(BQ.teamLabel(w.team))}</small></div>`; }
    } else who = `<div class="who none">？</div>`;
    $("#awBox").innerHTML = `<div class="step">頒獎 · 第 ${awIdx + 1} / ${awList.length} 個獎</div>
      <div class="ic"><i class="ph ph-${a.icon}" aria-hidden="true"></i></div>
      <div class="aname">${a.name}</div><div class="hint">${a.hint}</div>${who}
      <div class="tap">${awShown ? (awIdx + 1 < awList.length ? "按 A 看下一個獎" : "按 A 結束頒獎") : "先讓大家猜，按 A 揭曉"}</div>`;
    if (awShown && w) tone(1320, .6);
  }
  function awardStep() {
    if (aw.hidden) {
      if (awList.length) { aw.hidden = false; drawAward(); return; }   // Esc 關掉後再按 A：從剛剛那個獎接著
      if (!lastData) { $("#conn").className = "conn bad"; $("#conn").innerHTML = `<i class="ph ph-x"></i>還沒有成績資料，等左下角顯示「連線中」再按 A`; return; }
      awList = BQ.pickAwards(lastData.board); awIdx = 0; awShown = false; aw.hidden = false; drawAward(); return;
    }
    if (!awShown) { awShown = true; drawAward(); return; }
    if (awIdx + 1 < awList.length) { awIdx++; awShown = false; drawAward(); return; }
    aw.hidden = true; awList = [];   // 全部頒完：下次按 A 重新算名單
  }
  $("#bAward").onclick = awardStep;
  aw.onclick = awardStep;

  // ── 老師控制 ──
  const theme = () => {
    const light = document.documentElement.dataset.theme !== "light";
    document.documentElement.dataset.theme = light ? "light" : "dark";
    $("#bTheme").setAttribute("aria-pressed", String(light)); BQ.store.set("bq-theme", light ? "light" : "dark");
  };
  const sound = () => {
    soundOn = !soundOn;
    if (soundOn && !ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { soundOn = false; } }
    $("#bSound").setAttribute("aria-pressed", String(soundOn));
    $("#bSound").innerHTML = `<i class="ph ph-speaker-${soundOn ? "high" : "slash"}"></i>音效${soundOn ? "開" : "關"}（M）`;
    if (soundOn) tone(1320, .4);
  };
  const hide = () => $("#ctrl").classList.toggle("hidden");
  $("#bTheme").onclick = theme; $("#bSound").onclick = sound; $("#bHide").onclick = hide;
  document.addEventListener("keydown", e => {
    if (e.target.tagName === "INPUT") return;
    const k = e.key.toLowerCase();
    if (!cf.hidden) { if (k === "escape") closeCf(); return; }   // 確認框開著時，其他快捷鍵都不動
    if (!aw.hidden) { if (k === "escape") aw.hidden = true; else if (["a", " ", "enter", "arrowright", "pagedown"].includes(k)) { e.preventDefault(); awardStep(); } return; }   // pagedown＝簡報筆
    if (k === "a") awardStep();
    else if (k === "l") theme();
    else if (k === "m") sound();
    else if (k === "h") hide();
  });

  if (BQ.store.get("bq-theme", "dark") === "light") theme();
  render({ board: [], players: 0 }); lastData = null;   // 先畫空的；空畫面不算成績資料，沒連上前按 A 要跳提示
  poll(); setInterval(poll, 3000);
})();
</script>
</body>
</html>
